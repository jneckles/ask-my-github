[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ask-my-github"
version = "0.1.0"
description = "A minimal RAG CLI over local GitHub README files."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "fastapi",
    "python-dotenv",
    "uvicorn",
]

[project.optional-dependencies]
local = [
    "numpy",
    "pytest",
    "sentence-transformers",
]

[project.scripts]
ask = "src.ask:main"
ask-api = "src.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
